name: Mac app
on:
  workflow_dispatch:
  push:
    branches: [claude/charming-clarke-vc3o4v]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, name: apple-silicon}   # arm64
          - {os: macos-13, name: intel}           # x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: brew install leiningen
      - run: ./scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Groovehaus-Darkroom-${{ matrix.name }}
          path: dist/*.dmg
