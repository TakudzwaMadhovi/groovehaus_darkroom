name: Mac app
on:
  workflow_dispatch:
  push:
    branches: [claude/charming-clarke-vc3o4v]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, name: apple-silicon}   # arm64
          - {os: macos-15-intel, name: intel}      # x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: brew install leiningen
      - run: ./scripts/package-mac.sh
      - name: Launch the packaged app (smoke test)
        run: |
          mkdir -p smoke && hdiutil attach dist/*.dmg -mountpoint /Volumes/gd -nobrowse
          cp -R "/Volumes/gd/Groovehaus Darkroom.app" /Applications/
          hdiutil detach /Volumes/gd
          APP="/Applications/Groovehaus Darkroom.app"
          ls -R "$APP/Contents" | head -60 > smoke/bundle.txt
          cat "$APP/Contents/app/"*.cfg >> smoke/bundle.txt 2>/dev/null || true
          "$APP/Contents/MacOS/Groovehaus Darkroom" > smoke/out.txt 2>&1 &
          PID=$!
          sleep 25
          screencapture -x smoke/screen.png || true
          if kill -0 $PID 2>/dev/null; then echo "RUNNING after 25s" | tee smoke/result.txt; kill $PID; else echo "EXITED EARLY" | tee smoke/result.txt; fi
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null >> smoke/result.txt || true
          cat smoke/out.txt | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.name }}
          path: smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: Groovehaus-Darkroom-${{ matrix.name }}
          path: dist/*.dmg
